name: FPCC Cortex CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Ingest Excel Masters & Seed DB
        run: |
          python3 scripts/ingest_excel.py
          python3 scripts/seed_operations.py
          python3 scripts/seed_roles_and_users.py

      - name: Start Server in Background
        run: |
          cd server
          nohup node src/server.js > ../server.log 2>&1 &
          cd ..
          for i in {1..20}; do
            if curl -s http://localhost:3000/api/health | grep -q "ok"; then
              echo "Server is ready on port 3000!"
              break
            fi
            echo "Waiting for server to start... ($i/20)"
            sleep 1
          done
          if ! curl -s http://localhost:3000/api/health | grep -q "ok"; then
            echo "Server failed to start. Logs:"
            cat server.log
            exit 1
          fi

      - name: Run Operational Flow Verification
        run: |
          python3 scripts/test_operations_flow.py

      - name: Run CRM, Finance & WhatsApp ChatOps Verification
        run: |
          python3 scripts/test_crm_finance_whatsapp.py

      - name: Run Enterprise Backend 12-Service E2E Verification
        run: |
          python3 scripts/test_enterprise_backend.py

      - name: Run Unified Graph & Modular Reporting Verification
        run: |
          python3 scripts/test_unified_graph_reporting.py

      - name: Run Graph Workflows & Modular Triggers Verification
        run: |
          python3 scripts/test_graph_workflows.py

      - name: Run Role Management, Hierarchy & Security Verification
        run: |
          python3 scripts/test_roles_and_hierarchy.py
